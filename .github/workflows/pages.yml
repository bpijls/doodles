name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rethumb:
        description: "Regenerate thumbnails: slugs (space or comma separated), or 'all'. Empty = only new doodles."
        required: false
        default: ""

permissions:
  contents: write  # commit new thumbnails back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RETHUMB: ${{ inputs.rethumb }}  # via env, never interpolated into a script
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py dates doodles by their first commit

      - name: Which thumbnails are needed?
        id: plan
        run: |
          todo=$(python3 scripts/build.py --plan ${RETHUMB:+--rethumb $RETHUMB})
          echo "$todo"
          echo "needed=$([ -n "$todo" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.plan.outputs.needed == 'true'
        name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium-headless-shell

      # Also commits and pushes new/deleted thumbnails back to main (the thumbnail cache);
      # a failed push only warns. Needs `contents: write` above.
      - name: Build
        run: python3 scripts/build.py ${RETHUMB:+--rethumb $RETHUMB}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
