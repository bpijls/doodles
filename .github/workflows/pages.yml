name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rethumb:
        description: "Regenerate thumbnails: slugs (space or comma separated), or 'all'. Empty = only new doodles."
        required: false
        default: ""

permissions:
  contents: write  # build.py pushes new thumbnails back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RETHUMB: ${{ inputs.rethumb }}  # via env, never interpolated into a script
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py dates doodles by their first commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium-headless-shell
          else
            python -m playwright install --with-deps chromium-headless-shell
          fi

      # Makes missing thumbnails and pushes them back to main (the cache; a failed push only warns),
      # builds _site/, then lints (ruff + doodle checks) and runs pytest. Fails = no deploy.
      - name: Build, lint and test
        run: python scripts/build.py --check ${RETHUMB:+--rethumb $RETHUMB}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
