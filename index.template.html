<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodles</title>
<meta name="description" content="Small things made with Claude.">
<link rel="icon" href="favicon.svg">
<style>
:root {
  --bg: #f6f3ec; --fg: #1d1b18; --muted: #6f685d; --line: #ddd5c6;
  --card: #fffdf8; --accent: #c2410c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161513; --fg: #ece7dd; --muted: #9a9284; --line: #2e2b26;
          --card: #1e1c19; --accent: #fb923c; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 56px 16px 80px; }
header h1 { font: italic 600 clamp(2.4rem, 7vw, 3.6rem)/1 Georgia, "Times New Roman", serif;
  margin: 0; letter-spacing: -0.02em; }
header h1 span { color: var(--accent); }
header p { color: var(--muted); margin: 10px 0 28px; }
#q { width: 100%; padding: 10px 14px; font: inherit; color: inherit; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; outline: none; }
#q:focus { border-color: var(--accent); }
#tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line);
  background: none; color: var(--muted); cursor: pointer; font-family: inherit; }
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
ul { list-style: none; padding: 0; margin: 28px 0 0;
  display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
li a { display: flex; flex-direction: column; height: 100%; padding: 16px 18px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
li a:hover, li a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
li h2 { font-size: 1.05rem; margin: 0 0 4px; line-height: 1.3; }
li p { margin: 0 0 12px; color: var(--muted); font-size: .92rem; flex: 1; }
li small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); margin-top: 32px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>doodles<span>.</span></h1>
    <p>Small things made with Claude. <span id="count"></span></p>
  </header>
  <input id="q" type="search" placeholder="Filter…" aria-label="Filter doodles">
  <div id="tags"></div>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
</main>
<script>
const DOODLES = /*DOODLES*/[];
const list = document.getElementById("list"), q = document.getElementById("q");
const tagBox = document.getElementById("tags"), empty = document.getElementById("empty");
let active = null;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d + "T12:00").toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});

document.getElementById("count").textContent = DOODLES.length ? `${DOODLES.length} so far.` : "";
[...new Set(DOODLES.flatMap(d => d.tags))].sort().forEach(t => {
  const b = document.createElement("button");
  b.className = "tag"; b.textContent = t; b.setAttribute("aria-pressed", "false");
  b.onclick = () => { active = active === t ? null : t; render(); };
  tagBox.append(b);
});

function render() {
  const needle = q.value.trim().toLowerCase();
  const shown = DOODLES.filter(d =>
    (!active || d.tags.includes(active)) &&
    (!needle || [d.title, d.description, d.slug, ...d.tags].join(" ").toLowerCase().includes(needle)));
  list.innerHTML = shown.map(d => `<li><a href="${esc(d.href)}">
    <h2>${esc(d.title)}</h2><p>${esc(d.description)}</p><small>${fmt(d.date)}</small></a></li>`).join("");
  empty.hidden = shown.length > 0;
  tagBox.querySelectorAll(".tag").forEach(b => b.setAttribute("aria-pressed", String(b.textContent === active)));
}
q.addEventListener("input", render);
render();
</script>
</body>
</html>
