<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, doodles</title>
<meta name="description" content="A first doodle, so the portal isn't empty. Move the pointer around.">
<meta name="keywords" content="canvas, toy">
<style>html,body{margin:0;height:100%;background:#161513}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const fit = () => { c.width = innerWidth; c.height = innerHeight; }; fit(); addEventListener("resize", fit);
let pts = [], h = 20;
addEventListener("pointermove", e => pts.push({x: e.clientX, y: e.clientY, r: 2, h: h = (h + 2) % 360}));
(function draw() {
  x.fillStyle = "rgba(22,21,19,.08)"; x.fillRect(0, 0, c.width, c.height);
  pts = pts.filter(p => (p.r += .6) < 60);
  for (const p of pts) { x.strokeStyle = `hsla(${p.h},85%,60%,${1 - p.r / 60})`; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.stroke(); }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
