<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woordhakker – oefen woordvorming</title>
<meta name="description" content="Oefengame over morfologie: knip woorden in morfemen en oefen geleedheid, vrije en gebonden morfemen, affixen, samenstelling, afleiding en flexie.">
<meta name="keywords" content="game, taal, nederlands, education">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EC;--surface:#FFFFFF;--ink:#16263A;--muted:#5B6B7C;--line:#D3DCD4;
  --tile:#F6C445;--tile-ink:#3A2A00;--tile-edge:#D29E1A;
  --blue:#2F67A8;--blue-ink:#FFFFFF;--blue-edge:#1F4A7C;
  --ok:#1F7A52;--ok-bg:#E0F2E8;--bad:#B93A33;--bad-bg:#FBE6E4;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A24;--surface:#172533;--ink:#E8EEF3;--muted:#9AABBA;--line:#2A3B4C;
    --tile:#E8B52E;--tile-ink:#2A1E00;--tile-edge:#A97C0E;
    --blue:#6FA4E0;--blue-ink:#0B1A2B;--blue-edge:#3E6FA6;
    --ok:#62C894;--ok-bg:#15372A;--bad:#F08A82;--bad-bg:#3D1E1C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A24;--surface:#172533;--ink:#E8EEF3;--muted:#9AABBA;--line:#2A3B4C;
  --tile:#E8B52E;--tile-ink:#2A1E00;--tile-edge:#A97C0E;
  --blue:#6FA4E0;--blue-ink:#0B1A2B;--blue-edge:#3E6FA6;
  --ok:#62C894;--ok-bg:#15372A;--bad:#F08A82;--bad-bg:#3D1E1C;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-0.01em}
p{margin:0}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:4px;row-gap:10px;align-items:flex-end}
.t{--s:36px;width:var(--s);height:calc(var(--s)*1.15);display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:calc(var(--s)*0.6);
  background:var(--tile);color:var(--tile-ink);border-radius:6px;border-bottom:4px solid var(--tile-edge);position:relative;user-select:none;
  transition:margin .18s ease}
.t.sm{--s:28px}
.t.hl{background:var(--blue);color:var(--blue-ink);border-bottom-color:var(--blue-edge)}
.t.dash{background:transparent;border-bottom-color:transparent;color:var(--muted);width:auto;padding:0 2px}
.t.cut{margin-right:16px}
.t.cut::after{content:"";position:absolute;right:-11px;top:-4px;bottom:-6px;width:3px;border-radius:2px;background:var(--bad)}
.t.ok-cut::after{background:var(--ok)}
.hak .t{cursor:pointer}
.hak .t:last-child{cursor:default}

/* home */
.hero{padding:20px 0 28px}
.hero .tiles{gap:3px;margin-bottom:18px}
.hero .t{--s:clamp(26px,8.2vw,42px)}
.hero p{color:var(--muted);max-width:42ch}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.mode:hover{border-color:var(--blue)}
.mode strong{display:block;font-family:var(--display);font-size:19px}
.mode span{color:var(--muted);font-size:15px}
.mode .best{font-size:14px;color:var(--muted);white-space:nowrap}
.mode.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.main span,.mode.main .best{color:inherit;opacity:.75}

/* play */
.bar{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:8px}
.bar b{color:var(--ink)}
.quit{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px 0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.kind{font-size:15px;color:var(--blue);font-weight:700;margin-bottom:4px}
.prompt{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.25;margin-bottom:18px}
.word{margin-bottom:24px}
.hint{color:var(--muted);font-size:15px;margin:-10px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:13px 16px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.primary{background:var(--blue);color:var(--blue-ink);border:none;border-radius:10px;padding:14px 18px;font-weight:700;font-size:17px;width:100%}
.ghost{background:none;border:2px solid var(--line);border-radius:10px;padding:12px 18px;font-weight:700;width:100%}
.row{display:flex;gap:10px;margin-top:6px}
.fb{margin-top:20px;border-radius:12px;padding:16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h2{font-size:20px;margin-bottom:6px}
.fb .tiles{margin:10px 0 4px}
.fb .primary{margin-top:14px}

/* end */
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;margin:8px 0 4px}
.endsub{color:var(--muted);margin-bottom:24px}
.review{margin:26px 0;display:flex;flex-direction:column;gap:10px}
.review h2{font-size:20px;margin-bottom:4px}
.rv{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.rv b{display:block;font-size:16px}
.rv .a{color:var(--ok);font-weight:700}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ---------- Data ----------
const GELEED = [
  ["fiets",0,"Eén morfeem: je kunt het niet in betekenisvolle delen splitsen."],
  ["muziek",0,"Mu-ziek zijn lettergrepen, geen morfemen."],
  ["asperge",0,"Drie lettergrepen, maar morfologisch ongeleed."],
  ["olifant",0,"Oli en fant betekenen niets: één morfeem."],
  ["kampioen",0,"Kampioen heeft niets met een kamp te maken."],
  ["chocola",0,"Chocola komt uit één stuk."],
  ["paraplu",0,"Para en plu dragen hier geen betekenis."],
  ["huiswerk",1,"huis + werk: twee vrije morfemen."],
  ["fietspad",1,"fiets + pad."],
  ["zinloos",1,"zin + -loos: vrij + gebonden morfeem."],
  ["onwaar",1,"on- + waar."],
  ["studenten",1,"student + -en (flexie). Ook flexie telt als morfeem."],
  ["herfstvakantie",1,"herfst + vakantie. Va-kan-tie zijn alleen lettergrepen."],
  ["paraplustandaard",1,"paraplu + standaard: allebei één morfeem."],
  ["avocadosalade",1,"avocado + salade: lang, maar maar twee morfemen."],
  ["huiswerkbegeleiding",2,"huis + werk + begeleiding: meer dan drie morfemen."],
  ["onbereikbaar",2,"on- + be- + reik + -baar: vier morfemen."],
  ["tuinstoelkussen",2,"[tuin + stoel] + kussen."],
  ["zwembadhanddoek",2,"[zwem + bad] + [hand + doek]: vier morfemen."],
  ["appeltaartrecept",2,"[appel + taart] + recept."],
  ["voetbalschoenveter",2,"[[voet + bal] + schoen] + veter."],
  ["onvoorstelbaar",2,"on- + [[voor + stel] + -baar]."]
];
const VRIJ = [
  ["huis",1,"Kan zelfstandig in een zin staan: Ik woon in een huis."],
  ["mooi",1,"Dat is mooi. Kan alleen staan."],
  ["en",1,"Jij en ik. Ook kleine woordjes zijn vrije morfemen."],
  ["loop",1,"Ik loop. Een werkwoordstam kan alleen staan."],
  ["proof",1,"In coronaproof is proof een vrij morfeem (bestand tegen)."],
  ["school",1,"Een zelfstandig woord."],
  ["on-",0,"Ik ben on? Werkt niet: on- heeft een gastheer nodig."],
  ["-baar",0,"-baar kun je nooit alleen zeggen."],
  ["-heid",0,"Zoals in gladheid: kan niet zelfstandig staan."],
  ["-loos",0,"Zoals in zinloos: alleen in combinatie."],
  ["-elijk",0,"Zoals in vriendelijk."],
  ["-tje",0,"Zoals in koetje: kan niet alleen in een zin staan."],
  ["ver-",0,"Zoals in versieren: een prefix."],
  ["be-",0,"Zoals in belopen: een prefix."],
  ["-er",0,"Zoals in beheerder: iemand die iets doet."]
];
const AFFIX = [
  [["on","geluk"],[0],0,"on- staat vóór het woord."],
  [["op","vallen"],[0],0,"op- staat vóór het woord."],
  [["in","tocht"],[0],0,"in- staat vóór het woord."],
  [["be","loop"],[0],0,"be- staat vóór het woord."],
  [["eet","baar"],[1],1,"-baar staat achter het woord."],
  [["café","s"],[1],1,"Meervouds-s achter het woord."],
  [["ding","etje"],[1],1,"Verkleinwoord achter het woord."],
  [["loop","t"],[1],1,"Persoonsvorm-t achter het woord."],
  [["zin","loos"],[1],1,"-loos staat achter het woord."],
  [["ge","bel","d"],[0,2],2,"ge- en -d horen samen: rondom het woord."],
  [["ge","berg","te"],[0,2],2,"ge-…-te: geberg en bergte bestaan niet."],
  [["ge","werk","t"],[0,2],2,"Voltooid deelwoord: ge-…-t rondom de stam."],
  [["ge","vogel","te"],[0,2],2,"Verzamelwoord met ge-…-te."],
  [["ge","lop","en"],[0,2],2,"ge-…-en rondom de stam."],
  [["halle","bloody","luja"],[1],3,"Midden in het woord: een infix. Dit is Engels, in het Nederlands komt het bijna niet voor."]
];
const VORMING = [
  ["vaderland",0,"vader + land: twee vrije morfemen."],
  ["appelboom",0,"appel + boom."],
  ["coronaproof",0,"corona + proof: twee vrije morfemen."],
  ["schooltas",0,"school + tas."],
  ["zinloos",1,"zin + -loos: vrij + gebonden, nieuw woord."],
  ["onwaar",1,"on- + waar: nieuw woord met andere betekenis."],
  ["vriendelijk",1,"vriend + -elijk."],
  ["gladheid",1,"glad + -heid: de eigenschap van."],
  ["beheerder",1,"beheer + -er: iemand die iets doet."],
  ["studenten",2,"Meervoud: hetzelfde woord, aangepast aan de zin."],
  ["loopt",2,"Werkwoordsvorm: geen nieuw woord."],
  ["gebeld",2,"Voltooid deelwoord van bellen."],
  ["sneller",2,"Trap van vergelijking van snel."],
  ["werkte",2,"Verleden tijd van werken."],
  ["mooie",2,"Een mooie fiets: aanpassing aan de context."]
];
const HAK = [
  ["school|tas","Twee vrije morfemen: een tas voor school."],
  ["koffie|automaat","Koffie en automaat dragen elk een eigen betekenis."],
  ["zwem|bad|hand|doek","[zwembad] + [handdoek]: vier morfemen."],
  ["on|be|reik|baar","on- + be- + reik + -baar."],
  ["tuin|stoel|kussen","Een kussen voor een tuinstoel."],
  ["geo|drie|hoek","Drie morfemen. De structuur is geo + [driehoek]."],
  ["telefoon|boek","Telefoon is één begrip: niet tele-foon."],
  ["computer|spel","Computer kun je niet verder splitsen."],
  ["zin|loos","Vrij morfeem zin + suffix -loos."],
  ["student|en","Stam + meervouds-en."],
  ["appel|taart|recept","[appeltaart] + recept."],
  ["kerst|boom|ver|sier|ing","[kerstboom] + [ver-sier-ing]."],
  ["regen|boog","Beide delen kloppen."],
  ["olifant","Ongeleed! Oli en fant betekenen niets. Niet knippen was goed."],
  ["asperge","Drie lettergrepen, maar één morfeem."],
  ["kampioen","Kampioen is één morfeem."],
  ["paraplu|standaard","Paraplu en standaard zijn elk één morfeem."],
  ["voet|bal|schoen|veter","[[voetbal] + schoen] + veter."],
  ["vriend|elijk","Vrij morfeem + suffix -elijk."],
  ["glad|heid","Vrij morfeem + suffix -heid."]
];
const THEORIE = [
  ["Wat is een morfeem?",["Het kleinste betekenisdragende deel van een woord","Een lettergreep","Een klinker","Een woord van één letter"],0,"Morfemen zijn de bouwstenen van woorden."],
  ["Waarom is het Kroatische Krk voor ons geen woord?",["Wij kunnen het niet uitspreken: geen klankvorm","Het kan niet zelfstandig staan","Het heeft geen betekenis","Het is te kort"],0,"In het Nederlands heeft elk woord minstens één klinker."],
  ["Waarom is -heid geen woord?",["Het kan niet zelfstandig in een zin staan","Het heeft geen klinker","Het heeft geen betekenis","Het is Engels"],0,"Eigenschap 2: een woord kan zelfstandig in de zin staan."],
  ["De relatie tussen de vorm en de betekenis van een woord is meestal…",["Arbitrair: gewoon afspraak","Logisch","Klanknabootsend","Voorspelbaar"],0,"Er is niets aan het woord appel dat op de vrucht lijkt."],
  ["Bij welk woord zegt de vorm wél iets over de betekenis?",["koekoek","appel","tafel","fiets"],0,"Een onomatopee: klanknabootsing."],
  ["Asperge heeft drie lettergrepen. Hoeveel morfemen?",["1","2","3"],0,"Geleedheid heeft niets te maken met lettergrepen."],
  ["Wat levert on- + -baar op?",["Niets: gebonden + gebonden vormt geen woord","Een samenstelling","Een afleiding","Flexie"],0,"Een gebonden morfeem heeft altijd een vrij morfeem als gastheer nodig."],
  ["Welke vorm van morfologie breidt de woordenschat níet uit?",["Flexie","Samenstelling","Afleiding"],0,"Flexie past alleen de vorm aan de zin aan."],
  ["Is be-loop-baar een circumfix?",["Nee: be- en -baar zijn los na elkaar toegevoegd","Ja: er staat iets vóór en achter","Ja, want het is een afleiding","Nee, het is een infix"],0,"Belopen bestaat als los woord, dus zijn het twee aparte affixen."],
  ["Wat is de -s- in verjaardagstaart?",["Een tussenklank, geen infix","Een infix","Een circumfix","Een meervouds-s"],0,"Een infix staat ín een morfeem. Deze -s- staat tussen twee morfemen."],
  ["Hoe heet een gebonden morfeem ook wel?",["Affix","Stam","Samenstelling","Lettergreep"],0,"Gebonden morfemen noemen we affixen."],
  ["Wat is de juiste opbouw van geodriehoek?",["geo + [drie + hoek]","[geo + drie] + hoek","geo + drie + hoek, alles los"],0,"Het is een driehoek voor geometrie."]
];

// ---------- Builders ----------
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tiles(str,cls=""){const sm=str.length>10?" sm":"";return [...str].map(ch=>ch==="-"?`<span class="t dash${sm}">-</span>`:`<span class="t${sm} ${cls}">${esc(ch)}</span>`).join("")}

const B={
  geleed:([w,a,u])=>({kind:"Geleedheid",prompt:"Hoe geleed is dit woord?",word:tiles(w),options:["Ongeleed (1 morfeem)","Geleed (2 morfemen)","Meervoudig geleed (3+)"],answer:a,uitleg:u,label:w}),
  vrij:([m,v,u])=>({kind:"Vrij of gebonden",prompt:"Is dit een vrij of een gebonden morfeem?",word:tiles(m),options:["Vrij morfeem","Gebonden morfeem"],answer:v?0:1,uitleg:u,label:m}),
  affix:([parts,hl,a,u])=>{const len=parts.join("").length;return{kind:"Soorten affixen",prompt:"Wat voor affix is het blauwe deel?",word:parts.map((p,i)=>[...p].map(ch=>`<span class="t${len>10?" sm":""}${hl.includes(i)?" hl":""}">${esc(ch)}</span>`).join("")).join(""),options:["Prefix","Suffix","Circumfix","Infix"],answer:a,uitleg:u,label:parts.join("-")}},
  vorming:([w,a,u])=>({kind:"Woordvorming",prompt:"Welke manier van woordvorming is dit?",word:tiles(w),options:["Samenstelling","Afleiding","Flexie"],answer:a,uitleg:u,label:w}),
  hak:([s,u])=>{const w=s.replace(/\|/g,"");const cuts=[];let k=0;for(const ch of s){if(ch==="|")cuts.push(k-1);else k++}return{kind:"Woordhakker",hak:true,prompt:"Knip het woord in morfemen.",w,cuts,uitleg:u,label:s.replace(/\|/g,"-")}},
  theorie:([q,o,a,u])=>{const idx=shuffle(o.map((_,i)=>i));return{kind:"Theorie",prompt:q,word:"",options:idx.map(i=>o[i]),answer:idx.indexOf(a),uitleg:u,label:q}}
};
const SETS={geleed:GELEED,vrij:VRIJ,affix:AFFIX,vorming:VORMING,hak:HAK,theorie:THEORIE};
const MODES=[
  {id:"mix",name:"Alles door elkaar",desc:"12 vragen uit alle onderdelen",main:true},
  {id:"hak",name:"Woordhakker",desc:"Knip woorden zelf in morfemen"},
  {id:"geleed",name:"Geleedheid",desc:"Ongeleed, geleed of meervoudig geleed"},
  {id:"vrij",name:"Vrij of gebonden",desc:"Herken de soort morfeem"},
  {id:"affix",name:"Soorten affixen",desc:"Prefix, suffix, circumfix of infix"},
  {id:"vorming",name:"Woordvorming",desc:"Samenstelling, afleiding of flexie"},
  {id:"theorie",name:"Theorie",desc:"Begrippen uit het document"}
];
function buildQueue(mode){
  if(mode==="mix"){const q=[];for(const k of Object.keys(SETS))shuffle(SETS[k]).slice(0,2).forEach(x=>q.push(B[k](x)));return shuffle(q)}
  return shuffle(SETS[mode]).slice(0,10).map(B[mode]);
}

// ---------- Storage ----------
function getBest(id){try{return parseInt(localStorage.getItem("wh-best-"+id))||0}catch(e){return 0}}
function setBest(id,v){try{if(v>getBest(id))localStorage.setItem("wh-best-"+id,v)}catch(e){}}

// ---------- State & render ----------
const app=document.getElementById("app");
let S=null;

function home(){
  S=null;
  app.innerHTML=`<section class="hero">
    <div class="tiles" aria-hidden="true">${[..."woord"].map(c=>`<span class="t">${c}</span>`).join("")}<span class="t" style="visibility:hidden;width:8px"></span>${[..."hakker"].map(c=>`<span class="t hl">${c}</span>`).join("")}</div>
    <h1 class="sr" style="position:absolute;left:-9999px">Woordhakker</h1>
    <p>Oefen geleedheid, morfemen, affixen en woordvorming. Kies een onderdeel om te beginnen.</p>
  </section>
  <div class="modes">${MODES.map(m=>{const b=getBest(m.id);return`<button class="mode${m.main?" main":""}" data-m="${m.id}"><div><strong>${m.name}</strong><span>${m.desc}</span></div>${b?`<div class="best">Record ${b}</div>`:""}</button>`}).join("")}</div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
}

function start(mode){S={mode,queue:buildQueue(mode),i:0,score:0,streak:0,right:0,mistakes:[]};play()}

function head(){const n=S.queue.length;return`<div class="bar"><button class="quit" id="quit">Stoppen</button><span>Vraag <b>${S.i+1}</b> van ${n}</span><span>Punten <b>${S.score}</b>${S.streak>=2?` · reeks ${S.streak}`:""}</span></div><div class="progress"><i style="width:${(S.i/n)*100}%"></i></div>`}

function play(){
  const q=S.queue[S.i];
  if(q.hak)return playHak(q);
  app.innerHTML=`${head()}<div class="kind">${q.kind}</div><h2 class="prompt">${esc(q.prompt)}</h2>
    ${q.word?`<div class="tiles word">${q.word}</div>`:""}
    <div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="fb"></div>`;
  document.getElementById("quit").onclick=home;
  const btns=app.querySelectorAll(".opt");
  btns.forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.i,ok=pick===q.answer;
    btns.forEach(x=>{x.disabled=true;if(+x.dataset.i===q.answer)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    feedback(ok,q,q.options[q.answer]);
  });
}

function playHak(q){
  const cuts=new Set();const n=q.w.length;const sm=n>10?" sm":"";
  app.innerHTML=`${head()}<div class="kind">${q.kind}</div><h2 class="prompt">${q.prompt}</h2>
    <p class="hint">Tik op de letter waarna je wilt knippen. Tik nog eens om de knip weg te halen. Soms hoef je niet te knippen!</p>
    <div class="tiles word hak" id="hw">${[...q.w].map((c,i)=>`<span class="t${sm}" data-i="${i}" role="button" tabindex="${i<n-1?0:-1}" aria-label="Knip na ${c}">${esc(c)}</span>`).join("")}</div>
    <button class="primary" id="check">Controleer</button><div id="fb"></div>`;
  document.getElementById("quit").onclick=home;
  const hw=document.getElementById("hw");
  const toggle=el=>{const i=+el.dataset.i;if(i>=n-1||S.locked)return;cuts.has(i)?cuts.delete(i):cuts.add(i);el.classList.toggle("cut")};
  hw.querySelectorAll(".t").forEach(el=>{el.onclick=()=>toggle(el);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(el)}}});
  S.locked=false;
  document.getElementById("check").onclick=function(){
    S.locked=true;this.remove();
    const ok=cuts.size===q.cuts.length&&q.cuts.every(c=>cuts.has(c));
    if(ok)hw.querySelectorAll(".t.cut").forEach(t=>t.classList.add("ok-cut"));
    const correct=[...q.w].map((c,i)=>`<span class="t${sm}${q.cuts.includes(i)?" cut ok-cut":""}">${esc(c)}</span>`).join("");
    feedback(ok,q,q.label,correct);
  };
}

function feedback(ok,q,answerText,tileAnswer){
  if(ok){S.streak++;S.right++;S.score+=10+(S.streak>=3?5:0)}else{S.streak=0;S.mistakes.push({q,answerText})}
  const last=S.i===S.queue.length-1;
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="fb ${ok?"ok":"no"}" role="status"><h2>${ok?(S.streak>=3?"Goed! Reeksbonus +5":"Goed!"):"Niet helemaal"}</h2>
    ${!ok&&tileAnswer?`<div class="tiles">${tileAnswer}</div>`:""}
    ${!ok&&!tileAnswer?`<p><b>Antwoord:</b> ${esc(answerText)}</p>`:""}
    <p>${esc(q.uitleg)}</p>
    <button class="primary" id="next">${last?"Bekijk je score":"Volgende vraag"}</button></div>`;
  const nx=document.getElementById("next");nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
  nx.onclick=()=>{if(last)end();else{S.i++;play();window.scrollTo(0,0)}};
}

function end(){
  const n=S.queue.length,prev=getBest(S.mode);setBest(S.mode,S.score);
  const msg=S.right===n?"Foutloos! Jij kunt woorden hakken als de beste.":S.right>=n*0.7?"Goed bezig. Bekijk hieronder nog even je fouten.":"Blijf oefenen: lees de uitleg bij je fouten en probeer het opnieuw.";
  app.innerHTML=`<div class="kind">${MODES.find(m=>m.id===S.mode).name}</div>
    <div class="score">${S.score}</div>
    <p class="endsub">${S.right} van ${n} goed${S.score>prev&&prev>0?" · nieuw record!":""}. ${msg}</p>
    <div class="row"><button class="primary" id="again">Nog een keer</button><button class="ghost" id="menu">Menu</button></div>
    ${S.mistakes.length?`<div class="review"><h2>Je fouten</h2>${S.mistakes.map(m=>`<div class="rv"><b>${esc(m.q.label)}</b><span class="a">${esc(m.answerText)}</span> – ${esc(m.q.uitleg)}</div>`).join("")}</div>`:""}`;
  const mode=S.mode;
  document.getElementById("again").onclick=()=>start(mode);
  document.getElementById("menu").onclick=home;
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
