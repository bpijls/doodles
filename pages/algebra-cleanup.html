<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra Cleanup</title>
<meta name="description" content="Simplify algebra by exploding powers, numbers and terms into tiles and regrouping them. Levels and endless practice, in English and Dutch.">
<meta name="keywords" content="game, math, algebra, education">
<style>
  /* page skeleton that the Claude artifact host normally provides */
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@1,500&display=swap">
<style>
/* Layout: one-screen mobile app. Header, squared-paper board, margin note, sticky tool bar. */
:root {
  --paper: #f4f7fb; --grid: #dbe4ef; --ink: #182233; --muted: #5b6a80;
  --accent: #2f4fd6; --arc: #e2462f; --hl: #ffe45c; --warn: #c2410c; --good: #15803d;
  --tray: rgba(47, 79, 214, .045); --line: #c3cfdf; --card: #ffffff;
  --num: #ffffff; --num-edge: #c3cfdf; --edge: rgba(24, 34, 51, .22);
  --va: #0e8a8c; --vb: #d9701a; --vx: #7a4fd6; --vy: #d0406f; --vz: #4a6a2a; --on-var: #ffffff;
  --f-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121824; --grid: #1e2737; --ink: #e8edf5; --muted: #9aa8bd;
  --accent: #8ea4ff; --arc: #ff7a5c; --hl: #8a7413; --warn: #fb923c; --good: #4ade80;
  --tray: rgba(142, 164, 255, .06); --line: #34425a; --card: #1a2232;
  --num: #222c3e; --num-edge: #3b4a63; --edge: rgba(0, 0, 0, .5);
  --va: #13999b; --vb: #d6721f; --vx: #8462e0; --vy: #d4497a; --vz: #5c7f36; --on-var: #ffffff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121824; --grid: #1e2737; --ink: #e8edf5; --muted: #9aa8bd;
  --accent: #8ea4ff; --arc: #ff7a5c; --hl: #8a7413; --warn: #fb923c; --good: #4ade80;
  --tray: rgba(142, 164, 255, .06); --line: #34425a; --card: #1a2232;
  --num: #222c3e; --num-edge: #3b4a63; --edge: rgba(0, 0, 0, .5);
  --va: #13999b; --vb: #d6721f; --vx: #8462e0; --vy: #d4497a; --vz: #5c7f36; --on-var: #ffffff;
  color-scheme: dark; }

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100%; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* header */
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; margin-right: auto; }
.brand span { color: var(--accent); }
.chipbtn {
  border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px;
  cursor: pointer; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
}
.chipbtn:hover { border-color: var(--accent); }
.lvlrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.lvlrow h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -.02em; }
.badge { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); border: 1.5px solid currentColor; border-radius: 6px; padding: 2px 6px; }
.moves { margin-left: auto; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.moves b { color: var(--ink); }

/* written-out notation */
.written { margin-top: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; min-height: 44px; }
.written .label { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .7rem; }
.written .expr-n { color: var(--ink); font-size: 1.35rem; }
.mx, .expr-n { font-family: var(--f-math); white-space: nowrap; }
.mv { font-family: var(--f-math); font-style: italic; }
.mx sup, .expr-n sup { font-size: .62em; }
.nfrac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; }
.nfrac .nn { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
.nfrac .nd { padding: 0 .2em; }

/* board: squared paper */
.board {
  flex: 1 0 auto; min-height: 300px; margin-top: 8px; border-radius: 18px; border: 2px solid var(--line);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -1px -1px;
  display: flex; align-items: center; justify-content: center; padding: 22px 10px; position: relative;
}
.board { touch-action: none; }
.paths { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; overflow: visible; }
.paths path { fill: none; stroke: var(--arc); stroke-width: 3; stroke-linecap: round; }
.ghost { position: absolute; margin: 0; pointer-events: none; z-index: 7; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }
.trail polyline { fill: none; stroke: var(--hl); stroke-width: 30; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.tile.swept { box-shadow: 0 4px 0 var(--edge), 0 0 0 4px var(--hl); transform: translateY(-3px); }
.expr { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; max-width: 100%; }
.frac { display: flex; flex-direction: column; align-items: stretch; gap: 10px; min-width: 0; max-width: 100%; }
.side { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.bar { height: 4px; border-radius: 2px; background: var(--ink); }
.fbar { border: 0; padding: 0; height: 22px; background: transparent; cursor: pointer; position: relative; margin: -9px 0; }
.fbar::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--ink); transition: background .15s, height .15s, top .15s; }
.fbar:hover::before { background: var(--accent); height: 6px; top: 8px; }
.expr.stack { flex-direction: column; flex-wrap: nowrap; gap: 14px; }
.opchip.bigbar { border-radius: 4px; border: 0; min-height: 0; height: 8px; width: 100%; min-width: 120px; background: var(--ink); padding: 0; }
.opchip.bigbar:hover { background: var(--accent); }
.nfrac.big { font-size: 1.1em; }
.sign { font-family: var(--f-math); font-size: 2rem; line-height: 1; padding: 0 2px; }
.term {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px;
  padding: 9px; border-radius: 16px; border: 2px dashed var(--line); background: var(--tray); cursor: pointer;
  max-width: 100%; transition: border-color .15s, background .15s;
}
.term.solo { border-color: transparent; background: transparent; }
.term.solo:hover { border-color: var(--line); }
.term.sel { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.term.partner { border-color: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }

.tile {
  border: 0; min-height: 54px; min-width: 48px; padding: 0 11px; border-radius: 13px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 4px 0 var(--edge); transition: transform .12s ease, box-shadow .12s ease;
  touch-action: manipulation; user-select: none;
}
.tile:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--edge); }
.tile sup { font-family: var(--f-body); font-style: normal; font-weight: 700; font-size: 15px; align-self: flex-start; margin: 7px 0 0 2px; }
.tile.v { background: var(--c); color: var(--on-var); font-family: var(--f-math); font-style: italic; font-size: 30px; }
.tile.n { background: var(--num); border: 2px solid var(--num-edge); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile.g { background: var(--card); border: 2px solid var(--line); gap: 3px; padding: 0 8px; font-size: 22px; }
.tile.g .paren { font-family: var(--f-math); font-size: 40px; color: var(--muted); line-height: 1; }
.tile.p { background: var(--card); border: 2px solid var(--line); gap: 2px; padding: 6px 6px; cursor: pointer; }
.tile.p > .paren { font-family: var(--f-math); font-size: 54px; color: var(--muted); line-height: 1; padding: 0 2px; }
.tile.p > .side { gap: 6px; }
.tile.p .term { padding: 6px; }
.tile.p .sign { font-size: 1.6rem; }
.tile.p.sel { transform: translateY(-3px); }
.mini { display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; min-width: 28px; height: 32px; padding: 0 5px; font-size: 19px; }
.mini.v { background: var(--c); color: var(--on-var); font-family: var(--f-math); font-style: italic; }
.mini.n { border: 1.5px solid var(--num-edge); font-weight: 700; }
.mini sup { font-size: 11px; margin: 2px 0 0 1px; }

.tile.sel { transform: translateY(-5px); box-shadow: 0 9px 0 var(--edge), 0 0 0 3px var(--paper), 0 0 0 6px var(--accent); }
.tile.partner { animation: breathe 1.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { box-shadow: 0 4px 0 var(--edge), 0 0 0 0 transparent; } 50% { box-shadow: 0 4px 0 var(--edge), 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent); } }
.hint { box-shadow: 0 4px 0 var(--edge), 0 0 0 6px var(--hl) !important; }
.term.hint, .opchip.hint { border-color: var(--hl); box-shadow: 0 0 0 5px var(--hl) !important; }
.born { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pop { from { transform: scale(.35); opacity: 0; } }
.vanish { animation: vanish .4s ease-in forwards; }
@keyframes vanish { 30% { transform: scale(1.12); } to { transform: scale(.1) rotate(-25deg); opacity: 0; } }
.shake { animation: shake .45s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.opchip {
  font-family: var(--f-math); font-size: 2.2rem; min-width: 52px; min-height: 52px; border-radius: 50%;
  border: 2px dashed var(--accent); background: var(--card); color: var(--accent); cursor: pointer; line-height: 1;
}

/* margin note */
.note {
  margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 2px solid var(--line);
  line-height: 1.5; min-height: 3.2em; max-width: 68ch; align-self: center; width: 100%;
}
.note.ok { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.note.warn { border-color: var(--warn); }
.note.warn::before { content: "✋ "; }
.note .mx { font-size: 1.12em; }

/* tool bar */
.tools {
  position: sticky; bottom: 0; margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--paper) 30%);
}
.tool {
  min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.tool.main { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.tool:disabled { opacity: .4; cursor: default; }
.tool svg { width: 18px; height: 18px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  background: var(--card); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; animation: rise .3s ease-out;
  padding-block: 22px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-family: var(--f-display); font-weight: 800; margin: 0 0 6px; font-size: 2.2rem; letter-spacing: -.02em; }
.sheet .result { font-size: 2rem; margin: 6px 0 4px; }
.sheet p { color: var(--muted); margin: 6px 0 16px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.lvlgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; margin-top: 12px; }
.chipbtn.on { border-color: var(--accent); color: var(--accent); }
.plabel { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .72rem; color: var(--muted); margin: 14px 0 8px; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; font-weight: 700; }
.pchip.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.pwarn { color: var(--warn) !important; margin: 10px 0 0 !important; }
.lvlbtn {
  min-height: 60px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); cursor: pointer;
  font-weight: 700; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-variant-numeric: tabular-nums;
}
.lvlbtn small { font-size: .65rem; color: var(--muted); font-weight: 400; }
.lvlbtn.done { border-color: var(--good); }
.lvlbtn.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.lvlbtn.book small { color: var(--accent); }
.board.won .tile { animation: shine .6s ease both; }
@keyframes shine { 50% { transform: translateY(-8px) rotate(-3deg); } }

@media (max-width: 420px) {
  .tile { min-height: 48px; min-width: 42px; padding: 0 9px; }
  .tile.v { font-size: 26px; }
  .tile.n { font-size: 21px; }
  .board { padding: 18px 6px; }
  .tool { padding: 0 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand">Algebra <span>Cleanup</span></div>
    <button class="chipbtn" id="btnLevels" type="button"></button>
    <button class="chipbtn" id="btnPractice" type="button"></button>
    <button class="chipbtn" id="btnLang" type="button" aria-label="Language"></button>
    <button class="chipbtn" id="btnRestart" type="button"></button>
  </header>
  <div class="lvlrow"><h1 id="lvlTitle"></h1><span class="badge" id="lvlBadge" hidden></span><span class="moves" id="moves"></span></div>
  <div class="written"><span class="label" id="writtenLabel"></span><span class="expr-n" id="written"></span></div>
  <main class="board" id="board" aria-live="polite"></main>
  <div class="note" id="note" role="status"></div>
  <nav class="tools" id="tools">
    <button class="tool" id="btnUndo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span></span></button>
    <button class="tool" id="btnHint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg><span></span></button>
    <button class="tool main" id="btnExplode" type="button" hidden><span></span></button>
    <button class="tool" id="btnGather" type="button" hidden><span></span></button>
    <button class="tool main" id="btnSplit" type="button" hidden><span></span></button>
    <button class="tool" id="btnSkip" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg><span></span></button>
  </nav>
</div>
<div id="sheetHost"></div>

<script>
/* ===== CORE: algebra model and moves (no DOM) ===== */
let uid = 1;
const nid = () => uid++;
const N = v => ({ k: 'n', v, id: nid() });
const V = (b, e = 1) => ({ k: 'v', b, e, id: nid() });
const G = (f, e) => ({ k: 'g', f, e, id: nid() });          // bracket around a product, with exponent
const Pr = terms => ({ k: 'p', terms, e: 1, id: nid() });  // bracket around a sum
const T = (f, neg = false) => ({ k: 't', f, neg, id: nid() });
const F = (num, den) => ({ num, den: den || [T([N(1)])] });
const MAX_VAR = 16, MAX_GROUP = 8, MAX_SPLIT = 12;

const cloneF = f => f.k === 'n' ? N(f.v) : f.k === 'v' ? V(f.b, f.e) : f.k === 'g' ? G(f.f.map(cloneF), f.e) : Pr(f.terms.map(cloneT));
const cloneT = t => T(t.f.map(cloneF), t.neg);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
function primeFactors(n) { const r = []; let d = 2; while (n > 1) { while (n % d === 0) { r.push(d); n /= d; } d++; } return r; }
const fkey = f => f.k === 'n' ? 'n' + f.v : f.k === 'v' ? f.b + '^' + f.e : f.k === 'g' ? '(' + f.f.map(fkey).join('*') + ')^' + f.e
  : '[' + f.terms.map(t => (t.neg ? '-' : '+') + t.f.map(fkey).sort().join('*')).join('') + ']';
const innerKey = g => g.f.map(fkey).join('*');
function canMerge(x, y) {
  if (x.k !== y.k || x.k === 'p') return false;
  if (x.k === 'n') return true;
  if (x.k === 'v') return x.b === y.b;
  return innerKey(x) === innerKey(y);
}
function mergeF(x, y) {
  if (x.k === 'n') return N(x.v * y.v);
  if (x.k === 'v') return V(x.b, x.e + y.e);
  return G(x.f.map(cloneF), x.e + y.e);
}
const varPart = t => t.f.filter(f => f.k === 'v');
const sig = t => t.f.filter(f => f.k === 'v' || f.k === 'p').map(f => f.k === 'v' ? f.b + f.e : fkey(f)).sort().join('.');
const coefAbs = t => { const n = t.f.find(f => f.k === 'n'); return n ? n.v : 1; };
const coef = t => coefAbs(t) * (t.neg ? -1 : 1);
const isOne = den => den.length === 1 && !den[0].neg && den[0].f.length === 1 && den[0].f[0].k === 'n' && den[0].f[0].v === 1;
const SIDES = ['num', 'den'];

/* A term is tidy when it reads as: one number, each letter once (and, if allowed, one clean bracket). */
function tidy(t, allowB) {
  let n = 0, p = 0; const bs = new Set();
  for (const f of t.f) {
    if (f.k === 'g') return false;
    if (f.k === 'p') { if (!allowB || !sumClean(f.terms)) return false; p++; }
    else if (f.k === 'n') n++;
    else { if (bs.has(f.b)) return false; bs.add(f.b); }
  }
  return n <= 1 && p <= 1;
}
function sumClean(terms) {
  if (terms.length < 2 || !terms.every(t => tidy(t, true))) return false;
  const s = terms.map(sig); return new Set(s).size === s.length;
}

function cleanTerm(t) {
  t.f = t.f.filter(f => !((f.k === 'v' || f.k === 'g') && f.e === 0));
  if (t.f.length > 1) t.f = t.f.filter(f => !(f.k === 'n' && f.v === 1));
  if (!t.f.length) t.f = [N(1)];
  return t;
}
function normTerms(terms) {
  for (const t of terms) {
    const nf = [];
    for (const f of t.f) {
      if (f.k === 'p') {
        normTerms(f.terms);
        if (f.terms.length === 1) { const it = f.terms[0]; if (it.neg) t.neg = !t.neg; nf.push(...it.f); continue; }
      }
      nf.push(f);
    }
    t.f = nf;
    cleanTerm(t);
  }
  for (let i = 0; i < terms.length; i++) {
    const t = terms[i];
    if (t.f.length === 1 && t.f[0].k === 'p') {
      const inner = t.f[0].terms;
      if (t.neg) inner.forEach(it => { it.neg = !it.neg; });
      terms.splice(i, 1, ...inner); i += inner.length - 1;
    }
  }
}
const isUnit = side => side.length === 1 && side[0].f.length === 1 && side[0].f[0].k === 'n' && side[0].f[0].v === 1;
function negate(side) {

/* walk every term and factor, including those inside brackets */

const eachFactor = (S, fn) => walk(S, L => L.kind === 'f' && fn(L));

/* ---- notation (HTML) ---- */
function fx(f) {
  if (f.k === 'n') return `<span class="mn">${f.v}</span>`;
  if (f.k === 'v') return `<i class="mv">${f.b}</i>${f.e > 1 ? `<sup>${f.e}</sup>` : ''}`;
  if (f.k === 'p') return `(${sumHTML(f.terms)})`;

  return list.map((f, i) => (i > 0 && f.k === 'n' ? '·' : '') + fx(f)).join('');
}
function termHTML(t) { return factorsHTML(t.f, tidy(t, true)); }
function sumHTML(terms) {

}
function fracHTML(P, showOne) {
  if (isOne(P.den) && !showOne) return sumHTML(P.num);

}
function stateHTML(S) {

const mx = h => `<span class="mx">${h}</span>`;
const bx = b => mx(`<i class="mv">${b}</i>`);

/* ---- moves ---- each returns {ok,p,born} after mutating, or {no,p,ids} without mutating ---- */
function opExplode(S, id) {
  const L = locate(S, id), f = L.f, arr = L.term.f;
  if (f.k === 'v') {
    if (f.e < 2) return { no: 'atom', p: { x: mx(fx(f)) }, ids: [id] };
    if (f.e > MAX_VAR) return { no: 'tooBig', ids: [id] };
    const copies = Array.from({ length: f.e }, () => V(f.b, 1));
    arr.splice(L.i, 1, ...copies);
    return { ok: 'explodeVar', p: { x: mx(fx(f)), n: f.e, b: bx(f.b), ex: mx(copies.map(fx).join(' · ')) }, born: copies.map(c => c.id), origins: Object.fromEntries(copies.map(c => [c.id, [f.id]])) };
  }
  if (f.k === 'n') {
    if (f.v === 1) return { no: 'atom', p: { x: mx('1') }, ids: [id] };
    const pf = primeFactors(f.v);
    if (pf.length < 2) return { no: 'prime', p: { n: f.v }, ids: [id] };
    const parts = pf.map(N);
    arr.splice(L.i, 1, ...parts);
    return { ok: 'explodeNum', p: { n: f.v, ex: mx(pf.join(' · ')) }, born: parts.map(c => c.id), origins: Object.fromEntries(parts.map(c => [c.id, [f.id]])) };
  }

    const before = mx(termHTML(L.term));
    const others = L.term.f.filter(g => g !== f);
    const origins = {};
    const nts = f.terms.map(it => {
      const copies = others.map(o => { const k = cloneF(o); origins[k.id] = [o.id]; return k; });
      return T([...copies, ...it.f], L.term.neg !== it.neg);   // inner pieces keep their identity and slide
    });

function related(x, y) { return canMerge(x, y) || (x.k === 'v' && y.k === 'v' && x.b === y.b); }

function opPair(S, aId, bId) {

  if (r.type === 'none') return null;

function opGather(S, id) {
  const L = locate(S, id), arr = L.term.f;

function addTermsIn(terms, list) {
  const rest = list[0].f.filter(f => f.k !== 'n');
  const total = list.reduce((s, t) => s + coef(t), 0);
  const ex = mx(sumHTML(list));
  const at = terms.indexOf(list[0]);
  list.forEach(t => terms.splice(terms.indexOf(t), 1));
  if (total === 0) { if (!terms.length) terms.push(T([N(0)])); return { ex, r: '0', born: [], nt: null }; }

  if (Math.abs(total) !== 1 || !rest.length) {

  if (locs.length < 2) return null;

function termPair(S, aId, bId) {
  const A = locate(S, aId), B = locate(S, bId);
  if (A.p !== B.p) return { no: 'diffFrac', ids: [aId, bId] };
  if (A.terms !== B.terms) return { no: A.side !== B.side ? 'termSide' : 'bracketWall', ids: [aId, bId] };
  if (!tidy(A.term) || !tidy(B.term)) return { no: 'untidy', ids: [aId, bId] };
  if (sig(A.term) !== sig(B.term)) return { no: 'notLike', p: { v1: mx(termHTML(A.term)), v2: mx(termHTML(B.term)) }, ids: [aId, bId] };
  const vp = varPart(A.term);
  const r = addTermsIn(A.terms, [A.term, B.term].sort((a, b) => A.terms.indexOf(a) - A.terms.indexOf(b)));
  if (!r.nt) return { ok: 'likeZero', p: { ex: r.ex } };
  return { ok: 'likeAdd', p: { v: vp.length ? mx(factorsHTML(vp)) : '1', ex: r.ex, r: r.r }, born: r.born, origins: r.origins };
}

function opSplit(S, tid) {

  L.terms.splice(L.t, 1, ...nts);
  return { ok: 'split', p: { x: mx(termHTML(t)), n: c, v: mx(factorsHTML(vp)), ex: mx(sumHTML(nts)) }, born: Object.keys(origins).map(Number), origins };
}

function opMove(S, A, B) {
  const src = S.parts[A.p][A.side];
  let moving, whole = false;
  const label = mx(src.length > 1 || A.depth > 0 ? '(' + sumHTML(src) + ')' : fx(A.f));
  if (src.length > 1 || A.depth > 0) {
    moving = [src.length > 1 ? Pr(src.map(cloneT)) : null].filter(Boolean);
    if (src.length === 1) moving = src[0].f.map(cloneF);   // a single term that contains a bracket: move the whole term
    const neg = src.length === 1 && src[0].neg;
    S.parts[A.p][A.side] = [T([N(1)], neg)];
    whole = true;
  } else {
    const t = src[0];
    t.f.splice(t.f.indexOf(A.f), 1);
    if (!t.f.length) t.f = [N(1)];
    moving = [A.f];
  }
  const dst = S.parts[B.p][B.side];
  let target, at;
  if (dst.length > 1) { target = T([Pr(dst)]); S.parts[B.p][B.side] = [target]; at = target.f.length; }
  else { target = dst[0]; at = B.depth === 0 ? target.f.indexOf(B.f) + 1 : target.f.length; }
  target.f.splice(at, 0, ...moving);
  return { ok: whole ? 'moveWhole' : (A.side === 'num' ? 'moveNum' : 'moveDen'), p: { x: label }, born: moving.map(f => f.id) };
}

function partnersOf(S, sel) {
  const out = new Set();
  if (!sel) return out;
  const A = locate(S, sel.id);
  if (!A) return out;
  if (sel.t === 'f') {
    eachFactor(S, B => {
      if (B.f.id === sel.id) return;
      const r = pairCheck(S, A, B);
      if (r.type === 'merge' || r.type === 'cancel' || r.type === 'move' || r.type === 'addTerms' || (r.type === 'factor' && !r.useless)) out.add(B.f.id);
    });
  } else {
    eachTerm(S, B => {
      if (B.term.id === sel.id || B.terms !== A.terms) return;
      if (tidy(A.term) && tidy(B.term) && sig(A.term) === sig(B.term)) out.add(B.term.id);
    });
  }
  return out;
}

function hint(S) {
  if (S.parts.length > 1) {
    if (S.op === '/') return { k: 'hBar', ids: ['op'] };
    if (S.op === ':') return { k: 'hDiv', ids: ['op'] };
    const [P1, P2] = S.parts;
    for (const [a, b] of [[P1.num, P2.den], [P2.num, P1.den]]) {
      if (a.length !== 1 || b.length !== 1) continue;
      for (const x of a[0].f) for (const y of b[0].f)
        if (cancelCheck(x, y)?.type === 'cancel') return { k: 'hCancel', p: { x: mx(fx(x)), y: mx(fx(y)) }, ids: [x.id, y.id] };
    }
    for (const side of SIDES) {
      const src = P2[side], dst = P1[side];
      if (isUnit(src)) continue;
      const x = src[0].f[0], y = dst[0].f[0];
      return { k: 'hMove', p: { x: mx(src.length > 1 ? '(' + sumHTML(src) + ')' : fx(x)), y: mx(fx(y)) }, ids: [x.id, y.id] };
    }
  }
  const P = S.parts[0];
  let h = null;
  eachFactor(S, L => {
    if (h) return;
    if (L.f.k === 'g') h = { k: 'hGroup', p: { x: mx(fx(L.f)) }, ids: [L.f.id] };
  });
  if (h) return h;
  if (P.num.length === 1 && P.den.length === 1 && !isOne(P.den)) {
    const a = P.num[0], b = P.den[0];
    for (const x of a.f) for (const y of b.f)
      if (cancelCheck(x, y)?.type === 'cancel') return { k: 'hCancel', p: { x: mx(fx(x)), y: mx(fx(y)) }, ids: [x.id, y.id] };
    for (const x of a.f) for (const y of b.f) {
      const cr = cancelCheck(x, y);
      if (!cr || cr.type !== 'fizzle' || cr.msg === 'cancelCoprime') continue;
      const ids = x.k === 'v' ? [(x.e > y.e ? x : y).id] : [x, y].filter(f => primeFactors(f.v).length > 1).map(f => f.id);
      return { k: 'hExplodeCancel', p: { x: mx(fx(x)), y: mx(fx(y)) }, ids };
    }
  }
  if (S.goal === 'factor') {
    for (const ts of containers(S)) {
      for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++) {
        if (tidy(ts[i]) && tidy(ts[j]) && sig(ts[i]) === sig(ts[j])) continue;
        for (const a of ts[i].f) for (const b of ts[j].f) {
          if ((a.k === 'n' && b.k === 'n' && a.v === b.v && a.v > 1) || (a.k === 'v' && b.k === 'v' && a.b === b.b && a.e === b.e))
            return { k: 'hFactor', p: { x: mx(fx(a)), y: mx(fx(b)) }, ids: [a.id, b.id] };
        }
      }
    }
  }
  eachTerm(S, L => {
    const t = L.term;
    for (let i = 0; !h && i < t.f.length; i++) for (let j = i + 1; !h && j < t.f.length; j++)
      if (canMerge(t.f[i], t.f[j])) h = { k: 'hMerge', p: { x: mx(fx(t.f[i])), y: mx(fx(t.f[j])) }, ids: [t.f[i].id, t.f[j].id] };
  });
  if (h) return h;
  const pick = t => t.f.find(f => f.k === 'v') || t.f[0];
  for (const ts of containers(S))
    for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++)
      if (tidy(ts[i]) && tidy(ts[j]) && sig(ts[i]) === sig(ts[j]))
        return { k: 'hLike', p: { x: mx(termHTML(ts[i])), y: mx(termHTML(ts[j])) }, ids: [pick(ts[i]).id, pick(ts[j]).id] };
  if (S.goal === 'factor') {
    for (const ts of containers(S)) {
      for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++) {
        const na = ts[i].f.find(f => f.k === 'n'), nb = ts[j].f.find(f => f.k === 'n');
        if (na && nb && na.v !== nb.v && gcd(na.v, nb.v) > 1) return { k: 'hExplodeNums', p: { x: na.v, y: nb.v }, ids: [na.id, nb.id] };
        for (const va of varPart(ts[i])) for (const vb of varPart(ts[j])) {
          if (va.b === vb.b && va.e !== vb.e) {
            const big = va.e > vb.e ? va : vb, small = big === va ? vb : va;
            return { k: 'hExplodeVar', p: { x: mx(fx(big)), y: mx(fx(small)), b: bx(big.b) }, ids: [big.id] };
          }
        }
      }
    }
  }
  if (S.goal !== 'factor' && !S.allowB) {
    eachFactor(S, L => { if (!h && L.f.k === 'p') h = { k: 'hOpen', p: { x: mx(termHTML(L.term)) }, ids: [L.f.id] }; });
    if (h) return h;
  }
  return { k: 'hDone', ids: [] };
}

/* ===== PRACTICE: random problem generator ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const VARS = ['a', 'b', 'x', 'y'];
const otherVar = v => pick(VARS.filter(w => w !== v));
const coprime = (lo, hi, not) => { let u; do u = R(lo, hi); while (not && gcd(u, not) !== 1); return u; };
const coin = () => Math.random() < .5;

// a monomial term from {coef, vars:{a:2,...}}; untidy = spread it over several tiles
function mono(c, vars, neg, untidy) {
  const fs = [];
  if (untidy && c > 3 && primeFactors(c).length > 1) {
    const pf = primeFactors(c); const k = R(1, pf.length - 1);
    fs.push(N(pf.slice(0, k).reduce((a, b) => a * b, 1)), N(pf.slice(k).reduce((a, b) => a * b, 1)));
  } else if (c !== 1 || !Object.keys(vars).length) fs.push(N(c));
  for (const [b, e] of Object.entries(vars)) {
    if (untidy && e > 1 && coin()) { const k = R(1, e - 1); fs.push(V(b, k), V(b, e - k)); }
    else fs.push(V(b, e));
  }
  if (untidy) fs.sort(() => Math.random() - .5);
  return T(fs, neg);
}

const GEN = {
  powers(d) {
    const v = pick(VARS);
    const kinds = d === 1 ? ['prod', 'pp'] : d === 2 ? ['prod', 'pp', 'prodc', 'ppc'] : ['prod', 'prodc', 'ppc', 'mix'];
    const kind = pick(kinds);
    if (kind === 'prod') {
      const fs = Array.from({ length: d === 1 ? 2 : 3 }, () => V(v, R(1, d === 1 ? 4 : 5)));
      if (d === 3) { const w = otherVar(v); fs.splice(1, 0, V(w, R(1, 3))); fs.push(V(w, R(1, 3))); }
      return { parts: [F([T(fs)])] };
    }
    if (kind === 'pp') return { parts: [F([T([G([V(v, R(2, 4))], R(2, 3))])])] };
    if (kind === 'prodc') {
      const fs = [N(R(2, 6)), V(v, R(1, 4)), N(R(2, 5)), V(v, R(1, 3))];
      if (d === 3) fs.push(G([V(v, 2)], R(2, 3)));
      return { parts: [F([T(fs, d === 3 && coin())])] };
    }
    if (kind === 'ppc') {
      const inner = [N(R(2, 3)), V(v, R(1, 3))];
      if (d === 3) inner.push(V(otherVar(v), R(1, 2)));
      const fs = [G(inner, R(2, 3))];
      if (coin()) fs.unshift(N(R(2, 4)));
      return { parts: [F([T(fs)])] };
    }
    // mix: −2a · 5(a³)³ style
    return { parts: [F([T([N(R(2, 5)), V(v, R(1, 2)), N(R(2, 5)), G([V(v, R(2, 3))], R(2, 3))], coin())])] };
  },

  like(d) {
    const v = pick(VARS), w = otherVar(v);
    const sigPool = d === 1 ? [{ [v]: 1 }, { [v]: 2 }] : d === 2 ? [{ [v]: 1 }, { [v]: 2 }, { [w]: 1 }] : [{ [v]: 1, [w]: 1 }, { [v]: 2, [w]: 1 }, { [v]: 2 }];
    const n = d === 1 ? 3 : 4;
    const main = pick(sigPool);
    const sigs = [main, main];
    while (sigs.length < n) sigs.push(pick(sigPool));
    sigs.sort(() => Math.random() - .5);
    const terms = sigs.map((s, i) => mono(R(1, d === 1 ? 6 : 9), s, i > 0 && d > 1 && Math.random() < .35, d === 3 && Math.random() < .5));
    return { parts: [F(terms)] };
  },

  frac(d) {
    const v = pick(VARS), w = otherVar(v);
    if (d === 3 && coin()) {   // dividing fractions
      const p = R(2, 9), q = R(2, 5), r = R(2, 5), s = R(1, 3);
      return { parts: [F([mono(p, { [v]: R(1, 2) })], [mono(q, { [w]: R(1, 2) })]), F([mono(r, { [v]: 1 })], [mono(s, { [w]: 1 })])], op: ':' };
    }
    const g = d === 1 ? 1 : R(2, 5), p = R(1, 6), q = coprime(1, 5, p);
    const m = R(2, 7), k = R(1, 5);
    const numVars = { [v]: m }, denVars = { [v]: k === m ? k - 1 || 1 : k };
    if (d >= 2 && coin()) { numVars[w] = R(1, 4); denVars[w] = R(1, 3); }
    if (d === 3) {
      const e = R(2, 3), base = R(1, 2);
      const num = T([G([N(2), V(v, base)], e)]);

    }

  },

  open(d) {

    const inner = () => Pr([T([V(v)]), T([N(R(1, 7))], coin())]);

    if (d === 2) return { parts: [F([T([N(c), inner()]), mono(R(1, 6), { [v]: 1 }, coin())])] };

  factor(d) {

      if (coin()) { g = R(2, 5); const u = R(1, 4), s = coprime(2, 5, u); cv = {}; inner = [mono(u, { [v]: 1 }), mono(s, { [w]: 1 }, coin())]; }

    } else {
      g = R(2, 4); cv = { [v]: 1 }; const u = R(1, 4), s = coprime(2, 5, u);
      inner = [mono(u, { [v]: 1 }), mono(s, { [w]: R(1, 2) }, coin())];
    }
    const terms = inner.map(t => {
      const vars = { ...cv };
      varPart(t).forEach(f => { vars[f.b] = (vars[f.b] || 0) + f.e; });
      return mono(g * coefAbs(t), vars, t.neg);
    });
    return { parts: [F(terms)], goal: 'factor' };
  },

  mixed(d) {
    const v = pick(VARS);
    const E = pick([6, 8, 12]);
    const pairs = [[2, E / 2], [E / 2, 2], ...(E % 3 === 0 ? [[3, E / 3]] : []), ...(E % 4 === 0 ? [[4, E / 4]] : [])];
    const [m, n] = pick(pairs); let [k, l] = pick(pairs);

    const t1 = T([N(c1), G([V(v, m)], n)]);
    const t2 = d === 1 ? T([N(c2), G([V(v, k)], l)], coin()) : T([G([N(R(2, 3)), V(v, k)], l)]);
    if (d < 3) return { parts: [F([t1, t2])] };
    const s = c1 + Math.pow(t2.f[0].f[0].v, l);
    const divs = [2, 3, 5, 7].filter(p => s % p === 0);
    return { parts: [F([t1, t2], [mono(divs.length ? pick(divs) : R(2, 5), { [v]: R(1, 4) })])] };
  },
};

function autoSolve(S) {
  let k = 0;
  while (k++ < 80) {
    const h = hint(S); let r;
    if (h.k === 'hDone') break;
    if (h.k === 'hDiv' || h.k === 'hBar') r = opOp(S);
    else if (h.k === 'hGroup' || h.k === 'hOpen' || h.k === 'hExplodeVar') r = opExplode(S, h.ids[0]);
    else if (h.k === 'hExplodeCancel') { for (const id of h.ids) { r = opExplode(S, id); normalize(S); if (r && r.no) break; } }
    else if (h.k === 'hExplodeNums') { r = opExplode(S, h.ids[0]); normalize(S); if (r && !r.no) r = opExplode(S, h.ids[1]); }
    else r = opPair(S, h.ids[0], h.ids[1]);
    if (!r || r.no) return null;
    normalize(S);
  }
  return isClean(S) ? k - 1 : null;
}

function makeProblem(topics, d) {
  for (let tries = 0; tries < 60; tries++) {
    const topic = pick(topics);
    const S = GEN[topic](d);
    S.op = S.op || null; S.goal = S.goal || 'simplify';
    normalize(S);
    if (isClean(S)) continue;
    const test = JSON.parse(JSON.stringify(S));
    const moves = autoSolve(test);
    if (moves == null || moves > 60) continue;
    if (/^<span class="mn">0<\/span>$/.test(stateHTML(test))) continue;
    S.topic = topic;
    return S;
  }
  return null;
}

  if (hintIds.has(f.id)) b.classList.add('hint');
  if (born.has(f.id)) { b.classList.add('born'); b.style.animationDelay = (born.idx++ * 35) + 'ms'; }
  return b;
}

function sideEl(terms, partners) {
  const d = document.createElement('div'); d.className = 'side';
  terms.forEach((term, i) => {
    if (i > 0 || term.neg) { const s = document.createElement('span'); s.className = 'sign'; s.textContent = term.neg ? '−' : '+'; d.append(s); }
    const te = document.createElement('div');
    te.className = 'term' + (terms.length === 1 ? ' solo' : '');
    te.dataset.tid = term.id;
    if (sel && sel.t === 't' && sel.id === term.id) te.classList.add('sel');
    if (partners.has(term.id)) te.classList.add('partner');
    if (hintIds.has(term.id)) te.classList.add('hint');
    term.f.forEach((f, j) => {
      if (j > 0) { const dot = document.createElement('span'); dot.className = 'dot'; te.append(dot); }
      te.append(tileEl(f, partners));
    });
    d.append(te);
  });
  return d;
}

function render() {
  const partners = partnersOf(S, sel);
  born.idx = 0;
  const wrap = document.createElement('div'); wrap.className = 'expr';
  const stacked = S.parts.length > 1 && S.op === '/';
  if (stacked) wrap.classList.add('stack');
  S.parts.forEach((P, pi) => {
    if (pi > 0) {
      const op = document.createElement('button'); op.type = 'button'; op.dataset.op = '1';
      op.className = stacked ? 'opchip bigbar' : 'opchip';
      op.textContent = stacked ? '' : S.op;
      op.setAttribute('aria-label', stacked ? 'fraction bar' : S.op === ':' ? 'divide' : 'times');
      if (hintIds.has('op')) op.classList.add('hint');
      wrap.append(op);
    }
    const fr = document.createElement('div'); fr.className = 'frac';
    fr.append(sideEl(P.num, partners));
    if (!isOne(P.den) || S.op === '·') {
      let bar;
      if (S.parts.length === 1) {
        bar = document.createElement('button'); bar.type = 'button'; bar.className = 'bar fbar';
        bar.setAttribute('aria-label', 'fraction bar');
      } else { bar = document.createElement('div'); bar.className = 'bar'; }
      fr.append(bar);
      fr.append(sideEl(P.den, partners));
    }
    wrap.append(fr);
  });
  board.replaceChildren(wrap);
  $('written').innerHTML = stateHTML(S);

  // chrome
  $('btnLevels').textContent = t('levels');
  $('btnLang').textContent = lang === 'nl' ? 'EN' : 'NL';
  $('btnRestart').textContent = t('restart');
  $('brand').innerHTML = lang === 'nl' ? 'Algebra <span>Opruimen</span>' : 'Algebra <span>Cleanup</span>';
  $('btnPractice').textContent = t('practice');
  $('btnPractice').classList.toggle('on', mode === 'practice');
  $('btnSkip').hidden = mode !== 'practice'; $('btnSkip').querySelector('span').textContent = t('newProblem');
  if (mode === 'practice') {
    $('lvlTitle').textContent = t('practiceTitle');
    $('lvlBadge').hidden = false; $('lvlBadge').textContent = t('tp_' + S.topic) + ' · ' + t('d' + prac.d);
    $('moves').innerHTML = t('solved', { n: session.solved }) + t('streak', { n: session.streak });
  } else {
    $('lvlTitle').textContent = t('level', { n: lvl + 1 });
    $('lvlBadge').hidden = !LEVELS[lvl].book && LEVELS[lvl].goal !== 'factor'; $('lvlBadge').textContent = LEVELS[lvl].book ? t('book') : t('factorBadge');
    $('moves').innerHTML = t('moves', { n: moves }) + (best[lvl] != null ? t('best', { n: best[lvl] }) : '');
  }
  $('writtenLabel').textContent = t('written');
  $('btnUndo').querySelector('span').textContent = t('undo');
  $('btnUndo').disabled = !history.length;
  $('btnHint').querySelector('span').textContent = t('hint');
  const fSel = sel && sel.t === 'f', tSel = sel && sel.t === 't';
  $('btnExplode').hidden = !fSel; $('btnExplode').querySelector('span').textContent = t('explode');
  let gatherable = false;
  if (fSel) { const L = locate(S, sel.id); gatherable = L.term.f.filter(f => canMerge(L.f, f)).length >= 3; }
  $('btnGather').hidden = !gatherable; $('btnGather').querySelector('span').textContent = t('gather');
  $('btnSplit').hidden = !tSel; $('btnSplit').querySelector('span').textContent = t('split');
  document.documentElement.lang = lang;
}

/* ---- motion: every tile travels from where it was; new pieces fly in from their sources along arcs ---- */
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tileRects() {
  const m = new Map();
  board.querySelectorAll('.tile[data-id]').forEach(el => m.set(+el.dataset.id, el.getBoundingClientRect()));
  return m;
}
function animateMoves(rects, origins, arcs) {
  if (reduceMotion() || !board.animate) return 0;
  const br = board.getBoundingClientRect();
  const moving = new Set();
  let longest = 0, flight = 0;
  const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'paths'); board.append(svg);
  board.querySelectorAll('.tile[data-id]').forEach(el => {
    const parent = el.parentElement.closest('.tile.p');
    if (parent && moving.has(parent)) return;
    const id = +el.dataset.id, to = el.getBoundingClientRect();
    const src = origins[id] ? origins[id].filter(s => rects.has(s)) : rects.has(id) ? [id] : [];
    src.forEach((sid, k) => {
      const from = rects.get(sid);
      const dist = Math.hypot(from.left - to.left, from.top - to.top);
      if (dist < 2 && Math.abs(from.width - to.width) < 2) return;
      const isNew = !!origins[id];
      const lift = isNew || (arcs && dist > 40) || dist > 140 ? Math.min(150, 34 + dist * 0.45) * (isNew && flight++ % 2 ? -1 : 1) : 0;
      const target = k === 0 ? el : ghostOf(el, to, br);
      const dur = isNew ? 700 : 520;
      fly(target, from, to, lift, dur, k > 0);
      if (k === 0) moving.add(el);
      if (isNew && dist > 50) trail(svg, from, to, lift, br, dur);
      longest = Math.max(longest, dur);
    });
  });
  setTimeout(() => svg.remove(), longest + 500);
  return longest;
}
const mid = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
function ghostOf(el, to, br) {
  const g = el.cloneNode(true);
  g.classList.remove('born', 'sel', 'partner', 'hint');
  g.classList.add('ghost');
  Object.assign(g.style, { left: to.left - br.left + 'px', top: to.top - br.top + 'px', width: to.width + 'px', height: to.height + 'px' });
  board.append(g);
  return g;
}
function fly(el, from, to, lift, dur, isGhost) {
  const p0 = mid(from), p1 = mid(to);
  const c = { x: (p0.x + p1.x) / 2, y: (lift >= 0 ? Math.min(p0.y, p1.y) : Math.max(p0.y, p1.y)) - lift };
  const s0 = Math.min(2, Math.max(.4, from.width / to.width));
  const frames = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16, u = 1 - t;
    const x = u * u * p0.x + 2 * u * t * c.x + t * t * p1.x, y = u * u * p0.y + 2 * u * t * c.y + t * t * p1.y;
    const s = s0 + (1 - s0) * t;
    frames.push({ transform: `translate(${x - p1.x}px, ${y - p1.y}px) scale(${s})`, opacity: isGhost && t > .8 ? (1 - t) * 5 : 1 });
  }
  el.style.zIndex = 7;
  const a = el.animate(frames, { duration: dur, easing: 'cubic-bezier(.45,0,.25,1)' });
  a.onfinish = a.oncancel = () => { if (isGhost) el.remove(); else el.style.zIndex = ''; };
}
function trail(svg, from, to, lift, br, dur) {
  const p0 = mid(from), p1 = mid(to);
  const c = { x: (p0.x + p1.x) / 2, y: (lift >= 0 ? Math.min(p0.y, p1.y) : Math.max(p0.y, p1.y)) - lift };
  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('d', `M${p0.x - br.left},${p0.y - br.top} Q${c.x - br.left},${c.y - br.top} ${p1.x - br.left},${p1.y - br.top}`);
  svg.append(path);
  const len = path.getTotalLength ? path.getTotalLength() : 300;
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  path.animate([{ strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: .7 }, { strokeDashoffset: 0, opacity: 0 }],
    { duration: dur + 450, easing: 'ease-out', fill: 'forwards' });
}

function shake(ids) {
  requestAnimationFrame(() => ids.forEach(id => {
    const e = board.querySelector(`[data-id="${id}"],[data-tid="${id}"]`);
    if (e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
  }));
}

function run(fn, animIds) {
  if (busy || won) return;
  const rects = tileRects();
  const before = snap();
  const r = fn(S);
  if (!r) return false;
  if (r.no) {
    S = JSON.parse(before).S; // ensure untouched
    sel = null; hintIds = new Set(); born = new Set();
    render(); say(r.no, r.p, 'warn'); shake(r.ids || []);
    return true;
  }
  const finish = () => {
    history.push(before); moves++; normalize(S);
    // only bracket moves (putting outside brackets, opening brackets) travel along arcs; everything else just pops
    const origins = r.arcs ? r.origins || {} : {};
    sel = null; hintIds = new Set(); born = new Set((r.born || []).filter(id => !(id in origins)));
    render(); say(r.ok, r.p, 'ok');
    const ms = r.arcs ? animateMoves(rects, origins, true) : 0;
    busy = ms > 0;
    setTimeout(() => { busy = false; if (isClean(S)) win(); }, ms);
  };
  if (r.cancel && animIds) {
    busy = true;
    animIds.forEach(id => board.querySelector(`[data-id="${id}"]`)?.classList.add('vanish'));
    setTimeout(finish, 380);
  } else finish();
  return true;
}

function onFactor(id) {
  if (sel && sel.t === 'f' && sel.id === id) { run(s => opExplode(s, id)); return; }
  if (sel && sel.t === 'f') {
    const a = sel.id;
    if (run(s => opPair(s, a, id), [a, id])) return;
  }
  select({ t: 'f', id });
}
function onTerm(tid) {
  if (sel && sel.t === 't' && sel.id === tid) { sel = null; render(); return; }
  if (sel && sel.t === 't') { const a = sel.id; run(s => termPair(s, a, tid)); return; }
  select({ t: 't', id: tid });
}
function select(s) {
  sel = s; hintIds = new Set(); born = new Set();
  render();
  const has = partnersOf(S, sel).size > 0;
  say(s.t === 'f' ? (has ? 'pickedP' : 'picked') : (has ? 'pickedTermP' : 'pickedTerm'), {}, 'info');
}

let drag = null, suppressClick = false;
const SVGNS = 'http://www.w3.org/2000/svg';
function tileAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const t = el && el.closest('#board .tile');
  return t && !t.classList.contains('p') ? t : null;
}
function clearSweep() {
  if (drag && drag.svg) drag.svg.remove();
  board.querySelectorAll('.swept').forEach(el => el.classList.remove('swept'));
}
board.addEventListener('pointerdown', e => {
  if (busy || won || e.button > 0) return;
  drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, id: e.pointerId, active: false, ids: [], pts: [] };
});
board.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
    drag.active = true;
    try { board.setPointerCapture(e.pointerId); } catch {}
    const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'trail');
    const line = document.createElementNS(SVGNS, 'polyline'); svg.append(line);
    board.append(svg); drag.svg = svg; drag.line = line;
    sample(drag.x, drag.y);
  }
  // sample along the segment so fast swipes don't skip tiles
  const steps = Math.max(1, Math.ceil(Math.hypot(e.clientX - drag.lx, e.clientY - drag.ly) / 8));
  for (let i = 1; i <= steps; i++) sample(drag.lx + (e.clientX - drag.lx) * i / steps, drag.ly + (e.clientY - drag.ly) * i / steps);
  drag.lx = e.clientX; drag.ly = e.clientY;
});
function sample(x, y) {
  const br = board.getBoundingClientRect();
  drag.pts.push(`${x - br.left},${y - br.top}`);
  drag.line.setAttribute('points', drag.pts.join(' '));
  const t = tileAt(x, y);
  if (t && !drag.ids.includes(+t.dataset.id)) { drag.ids.push(+t.dataset.id); t.classList.add('swept'); }
}
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  if (!d.active) { drag = null; return; }
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  clearSweep(); drag = null;
  if (d.ids.length >= 2) run(s => opSweep(s, d.ids));
  else if (d.ids.length === 1) select({ t: 'f', id: d.ids[0] });
};
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', () => { clearSweep(); drag = null; });

board.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  if (busy || won) return;
  if (e.target.closest('.opchip')) return run(s => opOp(s));
  if (e.target.closest('.fbar')) return run(s => opBar(s));
  const hit = e.target.closest('.tile, .term');
  if (hit && hit.classList.contains('tile')) return onFactor(+hit.dataset.id);
  if (hit) return onTerm(+hit.dataset.tid);
  if (sel) { sel = null; render(); }
});

$('btnExplode').onclick = () => sel && run(s => opExplode(s, sel.id));
$('btnGather').onclick = () => sel && run(s => opGather(s, sel.id));
$('btnSplit').onclick = () => sel && run(s => opSplit(s, sel.id));
$('btnUndo').onclick = () => {
  if (!history.length || busy) return;
  const prev = JSON.parse(history.pop()); S = prev.S; moves = prev.moves;
  sel = null; born = new Set(); hintIds = new Set(); won = false; board.classList.remove('won');
  render(); say(null, null, 'info', { en: 'One step back.', nl: 'Eén stap terug.' });
};
$('btnHint').onclick = () => {
  if (won) return;
  const h = hint(S); sel = null; born = new Set(); hintIds = new Set(h.ids); render(); say(h.k, h.p, 'info');
};
$('btnRestart').onclick = () => {
  if (mode !== 'practice') return loadLevel(lvl);
  closeSheet(); S = JSON.parse(initial); history = []; moves = 0; sel = null; born = new Set(); hintIds = new Set(); won = false;
  board.classList.remove('won'); render(); sayIntro();
};
$('btnPractice').onclick = showPractice;
$('btnSkip').onclick = () => { if (busy) return; session.streak = 0; nextProblem(); say('skipped', {}, 'info'); };
$('btnLang').onclick = () => {
  lang = lang === 'nl' ? 'en' : 'nl'; store.set('lang', lang); render();
  if (lastNote) say(lastNote.key, lastNote.p, lastNote.type, lastNote.raw);
  if (won) win(true);
  else if (sheetFn && $('sheetHost').children.length) sheetFn();
};
$('btnLevels').onclick = () => showLevels();
board.addEventListener('keydown', e => {
  const p = e.target.closest && e.target.closest('.tile.p');
  if (p && e.target === p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onFactor(+p.dataset.id); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); $('btnUndo').click(); }
});

function closeSheet() { $('sheetHost').replaceChildren(); sheetFn = null; }
function openSheet(html) {
  const host = $('sheetHost');
  host.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  host.querySelector('.scrim').addEventListener('click', e => { if (e.target.classList.contains('scrim') && !won) closeSheet(); });
  return host;
}

function win(refresh) {
  won = true;
  if (mode === 'practice') {
    if (!refresh) { session.solved++; session.streak++; store.set('solvedTotal', store.get('solvedTotal', 0) + 1); board.classList.add('won'); render(); }
    const show = () => {
      const host = openSheet(`
        <h2>${t('win')}</h2>
        <p style="margin-bottom:0">${t(S.goal === 'factor' ? 'winSubF' : 'winSub')}</p>
        <div class="result expr-n">${stateHTML(S)}</div>
        <p>${t('winMoves', { n: moves })} ${t('winPractice', { n: session.solved })}</p>
        <div class="row">
          <button class="tool main" type="button" id="wNext">${t('nextProblem')} →</button>
          <button class="tool" type="button" id="wTopics">${t('changeTopics')}</button>
        </div>`);
      host.querySelector('#wNext').addEventListener('click', () => { closeSheet(); nextProblem(); });
      host.querySelector('#wTopics').addEventListener('click', () => { closeSheet(); won = false; showPractice(); });
      host.querySelector('#wNext').focus();
    };
    refresh ? show() : setTimeout(show, 650);
    return;
  }
  if (!refresh) {
    if (best[lvl] == null || moves < best[lvl]) { best[lvl] = moves; store.set('best', best); }
    board.classList.add('won'); render();
  }
  const last = lvl === LEVELS.length - 1;
  const show = () => {
    const host = openSheet(`
      <h2>${t('win')}</h2>
      <p style="margin-bottom:0">${t(S.goal === 'factor' ? 'winSubF' : 'winSub')}</p>
      <div class="result expr-n">${stateHTML(S)}</div>
      <p>${t('winMoves', { n: moves })}${t('winBest', { n: best[lvl] })}${last ? ' ' + t('allDone') : ''}</p>
      <div class="row">
        ${last ? '' : `<button class="tool main" type="button" id="wNext">${t('next')} →</button>`}
        <button class="tool" type="button" id="wReplay">${t('replay')}</button>
        <button class="tool" type="button" id="wLevels">${t('levels')}</button>
      </div>`);
    host.querySelector('#wNext')?.addEventListener('click', () => { closeSheet(); loadLevel(lvl + 1); });
    host.querySelector('#wReplay').addEventListener('click', () => { closeSheet(); loadLevel(lvl); });
    host.querySelector('#wLevels').addEventListener('click', () => { closeSheet(); won = false; showLevels(); });
    (host.querySelector('#wNext') || host.querySelector('#wReplay')).focus();
  };
  refresh ? show() : setTimeout(show, 650);
}

function showLevels() {
  sheetFn = showLevels;
  const btns = LEVELS.map((L, i) => `<button type="button" class="lvlbtn${best[i] != null ? ' done' : ''}${i === lvl ? ' cur' : ''}${L.book ? ' book' : ''}" data-l="${i}">
      ${best[i] != null ? '✓ ' : ''}${i + 1}<small>${L.book ? t('book') : L.goal === 'factor' ? t('factorBadge') : best[i] != null ? t('best', { n: best[i] }).replace(' · ', '') : '&nbsp;'}</small></button>`).join('');
  const host = openSheet(`<h2 style="font-size:1.6rem">${t('chooseLevel')}</h2><div class="lvlgrid">${btns}</div>`);
  host.querySelectorAll('.lvlbtn').forEach(b => b.addEventListener('click', () => { closeSheet(); loadLevel(+b.dataset.l); }));
}

loadLevel(lvl);
</script>
</body>
</html>
